name: CI Validation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build & Security Validation
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Unit Tests (Vitest)
        run: npm test

      - name: Run Static Code Analysis (ESLint & Stylelint)
        run: npm run lint

      - name: Run TypeScript Type Checker (tsc)
        run: npm run type-check

      - name: Verify Code Style Formatting (Prettier)
        run: npm run format:check

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

